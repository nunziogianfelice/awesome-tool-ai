<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenAI Tools KB</title>
    <meta
      name="description"
      content="Knowledge base ricercabile di tool, framework e risorse per il mondo AI agentico."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E" />
    <link rel="alternate" type="application/rss+xml" title="GenAI Tools KB" href="feed.xml" />
    <style>
      :root {
        --bg: #0b1020;
        --bg-elev: #131a30;
        --bg-card: #161e36;
        --border: #243056;
        --text: #e8ecf7;
        --text-dim: #9aa3bd;
        --accent: #7c9cff;
        --accent-soft: rgba(124, 156, 255, 0.15);
        --chip-bg: #1d2747;
        --chip-text: #b9c5ee;
        --badge-bg: #2a356a;
        --badge-text: #d6deff;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      header {
        padding: 32px 24px 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 0;
        color: var(--text-dim);
        font-size: 15px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 5;
        background: linear-gradient(
          180deg,
          var(--bg) 0%,
          var(--bg) 70%,
          rgba(11, 16, 32, 0)
        );
        padding: 16px 24px 12px;
      }
      .controls-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #search {
        width: 100%;
        padding: 14px 16px;
        font-size: 16px;
        background: var(--bg-elev);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      @media (max-width: 640px) {
        header { padding: 20px 16px 12px; }
        header h1 { font-size: 22px; }
        .controls { padding: 12px 16px 10px; }
        main { padding: 8px 16px 48px; }

        .filters {
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          padding-bottom: 4px;
          margin: 0 -16px;
          padding-left: 16px;
          padding-right: 16px;
        }
        .filters::-webkit-scrollbar { display: none; }
        .chip { white-space: nowrap; flex-shrink: 0; }

        .grid {
          grid-template-columns: 1fr;
        }
        .card-desc { font-size: 13px; }
      }
      .chip {
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text-dim);
        cursor: pointer;
        transition: all 0.12s ease;
        user-select: none;
      }
      .chip:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .chip.active {
        background: var(--accent-soft);
        color: var(--text);
        border-color: var(--accent);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 8px 24px 64px;
      }

      .stats {
        color: var(--text-dim);
        font-size: 13px;
        margin: 4px 0 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: transform 0.12s ease, border-color 0.12s ease,
          box-shadow 0.12s ease;
      }
      .card:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
        box-shadow: var(--shadow);
      }

      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .card-title a {
        color: var(--text);
      }
      .card-title a:hover {
        color: var(--accent);
      }
      .badge {
        flex-shrink: 0;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--badge-bg);
        color: var(--badge-text);
        white-space: nowrap;
      }
      .badge.resource {
        background: #3a2a5a;
        color: #d8c8ff;
      }

      .card-desc {
        margin: 0;
        font-size: 14px;
        color: var(--text-dim);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--chip-text);
      }

      .pricing {
        font-size: 11px;
        color: var(--text-dim);
        margin-left: auto;
      }

      .free-star {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        font-size: 13px;
        color: var(--text-dim);
      }
      .star-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
      }
      .star-btn:hover {
        border-color: var(--accent);
        text-decoration: none;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      #sort {
        background: var(--bg-elev);
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
      }
      #sort:focus { outline: none; border-color: var(--accent); }
      .active-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 999px;
        border: 1px solid var(--accent);
        background: var(--accent-soft);
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .badge-new {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 7px;
        border-radius: 999px;
        background: #1e4633;
        color: #7fe0ae;
        margin-left: 6px;
        vertical-align: middle;
        white-space: nowrap;
      }

      .tag { cursor: pointer; }
      .tag:hover { color: var(--text); }

      .card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: auto;
        padding-top: 4px;
      }
      .details-link { font-size: 13px; }
      .card-share {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .share-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: none;
        border: none;
        border-radius: 6px;
        color: var(--text-dim);
        cursor: pointer;
        padding: 0;
        opacity: 0.55;
        transition: all 0.12s ease;
      }
      .card:hover .share-btn { opacity: 0.9; }
      .share-btn:hover {
        opacity: 1;
        color: var(--accent);
        background: var(--accent-soft);
        text-decoration: none;
      }
      .share-btn.copied { color: #7fe0ae; opacity: 1; }
      .share-btn svg { display: block; }

      .card:target {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .empty {
        text-align: center;
        padding: 48px 16px;
        color: var(--text-dim);
      }

      footer {
        max-width: 1100px;
        margin: 24px auto 0;
        padding: 16px 24px 32px;
        color: var(--text-dim);
        font-size: 13px;
        border-top: 1px solid var(--border);
      }

      @media (max-width: 600px) {
        header {
          padding: 20px 16px 8px;
        }
        .controls {
          padding: 12px 16px 8px;
        }
        main {
          padding: 8px 16px 48px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>GenAI Tools KB</h1>
      <p>
        Knowledge base di tool, framework e risorse per il mondo AI agentico.
        Cerca, filtra, scopri.
      </p>
      <div class="free-star">
        <span>100% free &amp; open source</span>
        <a
          class="star-btn"
          href="https://github.com/nunziogianfelice/awesome-tool-ai"
          target="_blank"
          rel="noopener noreferrer"
          >⭐ Star on GitHub</a
        >
      </div>
    </header>

    <div class="controls">
      <div class="controls-inner">
        <input
          id="search"
          type="search"
          placeholder="Cerca per nome, descrizione, tag..."
          autocomplete="off"
          autofocus
        />
        <div class="filters" id="filters"></div>
        <div class="toolbar">
          <select id="sort" aria-label="Ordinamento">
            <option value="relevance">Ordine: rilevanza</option>
            <option value="newest">Più recenti</option>
          </select>
          <span id="active-tag-slot"></span>
        </div>
      </div>
    </div>

    <main>
      <div class="stats" id="stats"></div>
      <div class="grid" id="results"></div>
      <div class="empty" id="empty" style="display: none">
        Nessun risultato. Prova a cambiare query o filtro.
      </div>
    </main>

    <footer>
      Aggiornata continuamente. Contribuisci aprendo una PR su
      <code>tools.json</code>.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script src="tools.js"></script>
    <script>
      (function () {
        "use strict";

        const CATEGORY_LABELS = {
          "agent-framework": "Agent Frameworks",
          "browser-agent": "Browser Agents",
          "coding-assistant": "Coding Assistants",
          "data-ai": "Data & AI",
          "developer-tools": "Developer Tools",
          "llm-infrastructure": "LLM Infrastructure",
          mcp: "MCP",
          model: "Models",
          platform: "Platform",
          resource: "Resources",
          scraping: "Scraping",
          "tool-utility": "Tool & Utility",
          "ui-framework": "UI Framework",
          "vector-db": "Vector DB"
        };

        const SITE_URL = "https://nunziogianfelice.github.io/awesome-tool-ai";
        const NEW_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

        const ICON_LINKEDIN =
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>';
        const ICON_GITHUB =
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.04.77 2.1v3.11c0 .3.21.66.8.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>';
        const ICON_LINK =
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
        const ICON_CHECK =
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';

        const data = Array.isArray(window.TOOLS_DATA) ? window.TOOLS_DATA : [];
        const searchEl = document.getElementById("search");
        const filtersEl = document.getElementById("filters");
        const resultsEl = document.getElementById("results");
        const emptyEl = document.getElementById("empty");
        const statsEl = document.getElementById("stats");
        const sortEl = document.getElementById("sort");
        const tagSlotEl = document.getElementById("active-tag-slot");

        const fuse = new Fuse(data, {
          keys: [
            { name: "name", weight: 0.5 },
            { name: "description", weight: 0.3 },
            { name: "tags", weight: 0.15 },
            { name: "category", weight: 0.05 }
          ],
          threshold: 0.4,
          ignoreLocation: true,
          includeScore: false
        });

        let activeCategory = "all";
        let activeTag = new URLSearchParams(location.search).get("tag") || "";
        let sortMode = "relevance";

        function isNew(item) {
          if (!item.added_at) return false;
          return Date.now() - new Date(item.added_at + "T00:00:00Z") < NEW_DAYS_MS;
        }

        function setActiveTag(tag) {
          activeTag = tag;
          const url = new URL(location.href);
          if (tag) url.searchParams.set("tag", tag);
          else url.searchParams.delete("tag");
          history.replaceState(null, "", url);
          renderActiveTag();
          render();
        }

        function renderActiveTag() {
          tagSlotEl.innerHTML = "";
          if (!activeTag) return;
          const chip = document.createElement("button");
          chip.className = "active-tag";
          chip.innerHTML = `tag: ${escapeHtml(activeTag)} <span aria-hidden="true">✕</span>`;
          chip.title = "Rimuovi filtro tag";
          chip.addEventListener("click", () => setActiveTag(""));
          tagSlotEl.appendChild(chip);
        }

        function buildFilters() {
          const counts = data.reduce((acc, item) => {
            acc[item.category] = (acc[item.category] || 0) + 1;
            return acc;
          }, {});

          const cats = ["all", ...Object.keys(counts).sort()];
          filtersEl.innerHTML = "";
          cats.forEach((cat) => {
            const chip = document.createElement("button");
            chip.className = "chip" + (cat === "all" ? " active" : "");
            chip.dataset.cat = cat;
            const label =
              cat === "all" ? "Tutti" : CATEGORY_LABELS[cat] || cat;
            const count = cat === "all" ? data.length : counts[cat];
            chip.textContent = `${label} (${count})`;
            chip.addEventListener("click", () => {
              activeCategory = cat;
              document
                .querySelectorAll(".chip")
                .forEach((c) => c.classList.toggle("active", c === chip));
              render();
            });
            filtersEl.appendChild(chip);
          });
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          })[c]);
        }

        function renderCard(item) {
          const title = escapeHtml(item.name);
          const titleHtml = item.url
            ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
            : title;
          const newBadge = isNew(item)
            ? ' <span class="badge-new">nuovo</span>'
            : "";
          const catLabel = CATEGORY_LABELS[item.category] || item.category;
          const badgeClass =
            item.type === "resource" ? "badge resource" : "badge";
          const tags = (item.tags || [])
            .map(
              (t) =>
                `<span class="tag" data-tag="${escapeHtml(t)}" title="Filtra per tag">${escapeHtml(t)}</span>`
            )
            .join("");
          const pricing = item.pricing
            ? `<span class="pricing">${escapeHtml(item.pricing)}</span>`
            : "";
          const anchorId = `tool-${escapeHtml(item.id || "")}`;
          const pageUrl = `${SITE_URL}/tools/${encodeURIComponent(item.id)}.html`;
          const linkedinUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl)}`;
          const copyGh = item.url
            ? `<button class="share-btn" data-copy="${escapeHtml(item.url)}" title="Copia il link del tool" aria-label="Copia link GitHub del tool">${ICON_GITHUB}</button>`
            : "";

          return `
            <article class="card" id="${anchorId}">
              <div class="card-head">
                <h3 class="card-title">${titleHtml}${newBadge}</h3>
                <span class="${badgeClass}">${escapeHtml(catLabel)}</span>
              </div>
              <p class="card-desc">${escapeHtml(item.description || "")}</p>
              <div class="tags">${tags}${pricing}</div>
              <div class="card-foot">
                <a class="details-link" href="tools/${encodeURIComponent(item.id)}.html">dettagli →</a>
                <div class="card-share">
                  <a class="share-btn" href="${escapeHtml(linkedinUrl)}" target="_blank" rel="noopener noreferrer" title="Condividi su LinkedIn" aria-label="Condividi su LinkedIn">${ICON_LINKEDIN}</a>
                  ${copyGh}
                  <button class="share-btn" data-copy="${escapeHtml(pageUrl)}" title="Copia il link della pagina" aria-label="Copia link della pagina del tool">${ICON_LINK}</button>
                </div>
              </div>
            </article>
          `;
        }

        function getResults() {
          const q = searchEl.value.trim();
          let items = q ? fuse.search(q).map((r) => r.item) : data.slice();
          if (activeCategory !== "all") {
            items = items.filter((i) => i.category === activeCategory);
          }
          if (activeTag) {
            items = items.filter((i) => (i.tags || []).includes(activeTag));
          }
          if (sortMode === "newest") {
            items = items
              .slice()
              .sort((a, b) =>
                (b.added_at || "").localeCompare(a.added_at || "")
              );
          }
          return items;
        }

        function render() {
          const items = getResults();
          if (items.length === 0) {
            resultsEl.innerHTML = "";
            emptyEl.style.display = "block";
            statsEl.textContent = "0 risultati";
            return;
          }
          emptyEl.style.display = "none";
          resultsEl.innerHTML = items.map(renderCard).join("");
          statsEl.textContent = `${items.length} risultat${
            items.length === 1 ? "o" : "i"
          } su ${data.length}`;
        }

        let debounce;
        searchEl.addEventListener("input", () => {
          clearTimeout(debounce);
          debounce = setTimeout(render, 80);
        });

        sortEl.addEventListener("change", () => {
          sortMode = sortEl.value;
          render();
        });

        // Delegated handlers: copy-to-clipboard + tag filter
        resultsEl.addEventListener("click", (e) => {
          const btn = e.target.closest("button.share-btn[data-copy]");
          if (btn) {
            const original = btn.innerHTML;
            navigator.clipboard.writeText(btn.dataset.copy).catch(() => {});
            btn.innerHTML = ICON_CHECK;
            btn.title = "copiato ✓";
            btn.classList.add("copied");
            setTimeout(() => {
              btn.innerHTML = original;
              btn.classList.remove("copied");
            }, 1500);
            return;
          }
          const tag = e.target.closest(".tag[data-tag]");
          if (tag) setActiveTag(tag.dataset.tag);
        });

        // Scroll to hash on load
        function scrollToHash() {
          const hash = location.hash;
          if (!hash) return;
          const el = document.getElementById(hash.slice(1));
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        if (data.length === 0) {
          statsEl.textContent =
            "Nessun dato caricato. Verifica che tools.js sia presente.";
        } else {
          buildFilters();
          renderActiveTag();
          render();
          setTimeout(scrollToHash, 100);
        }
      })();
    </script>
  </body>
</html>
